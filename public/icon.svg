<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="recGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle inner border -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Outer NDI Network Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="8" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#accentCyan)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- REC Red Core Symbol -->
  <circle cx="256" cy="256" r="88" fill="url(#recGlow)"/>
  <circle cx="256" cy="256" r="102" fill="none" stroke="#ef4444" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Broadcast Aperture / NDI Beam marks -->
  <path d="M 256,64 L 256,96 M 256,416 L 256,448 M 64,256 L 96,256 M 416,256 L 448,256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Text NDI -->
  <text x="256" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="2">REC</text>
  <text x="256" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#94a3b8" letter-spacing="6">NDI PRO</text>
</svg>
